[project]
name = "unsaid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yfby", email = "harveykyleybanez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
unsaid = "unsaid:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
